services:
  hbbs:
    container_name: hbbs
    image: rustdesk/rustdesk-server:latest
    command: hbbs -r 80.102.10.85:21117
    volumes:
      - ./data:/root
    ports:
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
      - "21118:21118"
    depends_on:
      - hbbr
    restart: unless-stopped

  hbbr:
    container_name: hbbr
    image: rustdesk/rustdesk-server:latest
    command: hbbr
    volumes:
      - ./data:/root
    ports:
      - "21117:21117"
      - "21119:21119"
    restart: unless-stopped

  rustdesk-api:
    container_name: rustdesk-api
    image: lejianwen/rustdesk-api:latest
    environment:
      - TZ=Europe/Madrid
      - RUSTDESK_API_LANG=es
      - RUSTDESK_API_RUSTDESK_ID_SERVER=80.102.10.85:21116
      - RUSTDESK_API_RUSTDESK_RELAY_SERVER=80.102.10.85:21117
      - RUSTDESK_API_RUSTDESK_API_SERVER=http://80.102.10.85:21114
      - RUSTDESK_API_RUSTDESK_KEY_FILE=/data/id_ed25519.pub
    volumes:
      - ./api-data:/app/data
      - ./data:/data:ro
    ports:
      - "21114:21114"
    depends_on:
      - hbbs
    restart: unless-stopped